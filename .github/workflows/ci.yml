name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege: CI only reads the code

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate seed data
        run: python -m scripts.seed --check
      - name: Tests (no cloud keys; in-memory DB + FakeAIGateway)
        run: pytest -q
      - name: API schema is up to date (the frontend's types are generated from it)
        run: |
          python -m scripts.export_openapi /tmp/api.schema.json
          diff -u ../frontend/types/api.schema.json /tmp/api.schema.json || {
            echo "::error::The API changed: run 'python -m scripts.export_openapi' (backend) and 'npm run api:types' (frontend), and commit both."; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - name: TypeScript types are generated from the committed API schema
        run: npm run api:types && git diff --exit-code types/api.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - run: npm run build

  e2e:
    # A real browser against a real backend: in-memory DB + FakeAIGateway (no keys), Chrome from the runner image.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
